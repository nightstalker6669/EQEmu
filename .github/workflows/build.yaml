name: Build
on:
  push:
    branches:
      - master
      - develop
  pull_request:
permissions:
  contents: read
jobs:
  inputs:
    name: Fetch pinned public inputs
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'nightstalker6669/EQEmu'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout input contract
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Restore pinned public input cache
        uses: actions/cache@v5
        with:
          path: build/release-input-cache
          key: pinned-release-inputs-v1-${{ hashFiles('tools/release/release-inputs.json') }}

      - name: Fetch and verify public inputs
        run: python3 tools/release/package_runtime.py --prepare-inputs pinned-release-inputs

      - name: Hand off only the two verified public assets
        uses: actions/upload-artifact@v4
        with:
          name: pinned-release-inputs
          path: pinned-release-inputs/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux
    needs: inputs
    if: ${{ always() && !cancelled() && (needs.inputs.result == 'success' || needs.inputs.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build ccache uuid-dev

      - name: Restore vcpkg Cache
        uses: actions/cache@v5
        with:
          path: |
            build/vcpkg_installed
            submodules/vcpkg/downloads
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-
            ${{ runner.os }}-vcpkg-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DEQEMU_BUILD_TESTS=ON \
            -DEQEMU_BUILD_LOGIN=ON \
            -DEQEMU_BUILD_LUA=ON \
            -DEQEMU_BUILD_PERL=ON \
            -DEQEMU_BUILD_CLIENT_FILES=ON || {
              configure_status=$?
              if [ -f build/vcpkg-bootstrap.log ]; then
                cat build/vcpkg-bootstrap.log
              fi
              exit "$configure_status"
            }

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ./bin/tests

      - name: Receive verified pinned input artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'nightstalker6669/EQEmu'
        uses: actions/download-artifact@v4
        with:
          name: pinned-release-inputs
          path: build/release-input-cache

      - name: Package linux runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'nightstalker6669/EQEmu'
        run: python3 tools/release/package_runtime.py --platform linux --input-directory build/release-input-cache

      - name: Upload linux runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'nightstalker6669/EQEmu'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    needs: inputs
    if: ${{ always() && !cancelled() && (needs.inputs.result == 'success' || needs.inputs.result == 'skipped') }}
    runs-on: windows-latest
    env:
      VCPKG_DOWNLOADS: ${{ github.workspace }}\submodules\vcpkg\downloads
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg_archives,readwrite'
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Setup MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Restore vcpkg Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_DOWNLOADS }}
            ${{ github.workspace }}/vcpkg_archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DEQEMU_BUILD_TESTS=ON `
            -DEQEMU_BUILD_LOGIN=ON `
            -DEQEMU_BUILD_LUA=ON `
            -DEQEMU_BUILD_ZLIB=ON `
            -DEQEMU_BUILD_PERL=ON `
            -DEQEMU_BUILD_CLIENT_FILES=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target ALL_BUILD -- /m

      - name: Test
        working-directory: build
        run: ./bin/Release/tests.exe

      - name: Receive verified pinned input artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'nightstalker6669/EQEmu'
        uses: actions/download-artifact@v4
        with:
          name: pinned-release-inputs
          path: build/release-input-cache

      - name: Package windows runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'nightstalker6669/EQEmu'
        run: python tools/release/package_runtime.py --platform windows --input-directory build/release-input-cache

      - name: Upload windows runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'nightstalker6669/EQEmu'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish complete Latest
    needs: [linux, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'nightstalker6669/EQEmu'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: eqemu-latest-release
      cancel-in-progress: false
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download both runtime packages
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          merge-multiple: true
          path: release-assets

      - name: Verify and publish Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/publish_release.py --assets release-assets
